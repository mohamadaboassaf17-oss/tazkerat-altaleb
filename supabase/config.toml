# Hand-created minimal config (project_id "tazkerat-altaleb").
# `supabase init` could not run because the Supabase CLI binary could not be
# downloaded on this machine (GitHub release downloads throttled to ~KB/s and
# Docker is unavailable). All other keys fall back to CLI defaults.
project_id = "tazkerat-altaleb"

[db]
# Local Postgres port (used only when running `supabase start` with Docker).
port = 54322

[studio]
enabled = true
port = 54323

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "https://localhost:5173",
  "http://localhost:5173/auth/callback",
  "http://localhost:5173/login",
  "http://localhost:5173/update-password",
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
